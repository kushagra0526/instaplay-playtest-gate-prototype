<!doctype html><html><head><meta charset="utf-8"><title>@@TITLE@@</title>
<style>html,body{margin:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center}canvas{background:@@BG@@;touch-action:none}</style></head>
<body><canvas id="game" width="360" height="640"></canvas>
<script>
/*IFNOT:blank*/const canvas = document.getElementById('game');/*FI*/
/*IF:blank*/const canvas = document.createElement('canvas'); canvas.width = 360; canvas.height = 640;/*FI*/
const ctx = canvas.getContext('2d');
const W = 360, H = 640;
/*IFNOT:nondet*/const rand = Math.random;/*FI*/
/*IF:nondet*/const rand = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;/*FI*/
let state = 'start', score = 0, best = 0, playTime = 0, bonusT = 0;
const effects = [];
const keys = {};
let action = false, touchDir = 0;

@@FAMILY@@

function reset() { score = 0; bonusT = 0; G.reset(); }
function startOrRestart() {
  if (state === 'start') { reset(); state = 'play'; }
  /*IFNOT:restart*/else if (state === 'over') { reset(); state = 'play'; }/*FI*/
  /*IF:restart*/else if (state === 'gameover') { reset(); state = 'play'; }/*FI*/
}
/*IFNOT:keycanvas*/window/*FI*//*IF:keycanvas*/canvas/*FI*/.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    if (state === 'play') action = true; else startOrRestart();
  }
});
/*IFNOT:keycanvas*/window/*FI*//*IF:keycanvas*/canvas/*FI*/.addEventListener('keyup', e => { keys[e.key] = false; });
/*IFNOT:notouch*/
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (state !== 'play') { startOrRestart(); return; }
  if (x < 1 / 3) touchDir = -1; else if (x > 2 / 3) touchDir = 1; else action = true;
});
window.addEventListener('pointerup', () => { touchDir = 0; });
/*FI*/
function input() {
  return { left: !!(keys.ArrowLeft || keys.a || touchDir < 0), right: !!(keys.ArrowRight || keys.d || touchDir > 0),
           up: !!(keys.ArrowUp || keys.w), down: !!(keys.ArrowDown || keys.s), action };
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '@@BG@@'; ctx.fillRect(0, 0, W, H);
  if (state !== 'start') G.draw(ctx);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  if (state === 'start') { ctx.fillText('@@TITLE@@', W / 2, H / 2 - 20); ctx.font = '16px sans-serif'; ctx.fillText('Tap or press Space', W / 2, H / 2 + 14); }
  else ctx.fillText(String(score), W / 2, 40);
  if (state === 'over') { ctx.fillText('Game over', W / 2, H / 2); ctx.font = '16px sans-serif'; ctx.fillText('Tap or Space to restart', W / 2, H / 2 + 30); }
}
let last = null;
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (state === 'play') {
    playTime += dt;
    /*IF:crash*/if (playTime > 8) { const fx = effects[effects.length - 1]; fx.life -= dt; }/*FI*/
    /*IFNOT:fps*/const r = G.update(dt, input());/*FI*/
    /*IF:fps*/const r = G.update(1 / 60, input());/*FI*/
    action = false;
    score += r.gain;
    /*IFNOT:scoreover*/bonusT += dt; if (bonusT >= 1) { bonusT -= 1; score += 1; }/*FI*/
    if (r.dead) {
      /*IF:softlock*/return;/*FI*/
      state = 'over'; best = Math.max(best, score);
    }
  }
  /*IF:scoreover*/bonusT += dt; if (bonusT >= 1) { bonusT -= 1; score += 1; }/*FI*/
  draw();
  requestAnimationFrame(frame);
}
window.__game = { score: () => score, over: () => state === 'over' };
requestAnimationFrame(frame);
</script></body></html>
