<!doctype html><html><head><meta charset="utf-8"><title>DODGER</title>
<style>html,body{margin:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center}canvas{background:#2b2d42;touch-action:none}</style></head>
<body><canvas id="game" width="360" height="640"></canvas>
<script>
const canvas = document.getElementById('game');

const ctx = canvas.getContext('2d');
const W = 360, H = 640;
const rand = Math.random;

let state = 'start', score = 0, best = 0, playTime = 0, bonusT = 0;
const effects = [];
const keys = {};
let action = false, touchDir = 0;

const G = {
  reset() {
    this.px = W / 2; this.blocks = []; this.t = 0; this.spawn = 0.3;
    
  },
  update(dt, inp) {
    let gain = 0, dead = false;
    this.t += dt;
    this.px += ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * 244 * dt;
    this.px = Math.max(16, Math.min(W - 16, this.px));
    this.spawn -= dt;
    if (this.spawn <= 0) {
      this.spawn = Math.max(0.25, 0.7 - this.t * 0.01);
      const w = 24 + rand() * 30;
      this.blocks.push({ x: rand() * (W - w), y: -w, w, h: w, v: 180 + rand() * 80 + this.t * 4 });
    }
    for (const b of this.blocks) b.y += b.v * dt;
    const before = this.blocks.length;
    this.blocks = this.blocks.filter(b => b.y < H);
    gain += before - this.blocks.length;
    for (const b of this.blocks) if (b.x < this.px + 14 && b.x + b.w > this.px - 14 && b.y < 594 && b.y + b.h > 566) dead = true;
    return { gain, dead };
  },
  draw(c) {
    c.fillStyle = '#8ecae6'; c.fillRect(this.px - 14, 566, 28, 28);
    c.fillStyle = '#ffb703'; for (const b of this.blocks) c.fillRect(b.x, b.y, b.w, b.h);
  }
};


function reset() { score = 0; bonusT = 0; G.reset(); }
function startOrRestart() {
  if (state === 'start') { reset(); state = 'play'; }
  else if (state === 'over') { reset(); state = 'play'; }
  
}
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    if (state === 'play') action = true; else startOrRestart();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (state !== 'play') { startOrRestart(); return; }
  if (x < 1 / 3) touchDir = -1; else if (x > 2 / 3) touchDir = 1; else action = true;
});
window.addEventListener('pointerup', () => { touchDir = 0; });

function input() {
  return { left: !!(keys.ArrowLeft || keys.a || touchDir < 0), right: !!(keys.ArrowRight || keys.d || touchDir > 0),
           up: !!(keys.ArrowUp || keys.w), down: !!(keys.ArrowDown || keys.s), action };
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#2b2d42'; ctx.fillRect(0, 0, W, H);
  if (state !== 'start') G.draw(ctx);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  if (state === 'start') { ctx.fillText('DODGER', W / 2, H / 2 - 20); ctx.font = '16px sans-serif'; ctx.fillText('Tap or press Space', W / 2, H / 2 + 14); }
  else ctx.fillText(String(score), W / 2, 40);
  if (state === 'over') { ctx.fillText('Game over', W / 2, H / 2); ctx.font = '16px sans-serif'; ctx.fillText('Tap or Space to restart', W / 2, H / 2 + 30); }
}
let last = null;
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (state === 'play') {
    playTime += dt;
    
    const r = G.update(dt, input());
    
    action = false;
    score += r.gain;
    
    if (r.dead) {
      
      state = 'over'; best = Math.max(best, score);
    }
  }
  bonusT += dt; if (bonusT >= 1) { bonusT -= 1; score += 1; }
  draw();
  requestAnimationFrame(frame);
}
window.__game = { score: () => score, over: () => state === 'over' };
requestAnimationFrame(frame);
</script></body></html>
