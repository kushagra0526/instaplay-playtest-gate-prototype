<!doctype html><html><head><meta charset="utf-8"><title>SNAKE</title>
<style>html,body{margin:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center}canvas{background:#14213d;touch-action:none}</style></head>
<body><canvas id="game" width="360" height="640"></canvas>
<script>

const canvas = document.createElement('canvas'); canvas.width = 360; canvas.height = 640;
const ctx = canvas.getContext('2d');
const W = 360, H = 640;
const rand = Math.random;

let state = 'start', score = 0, best = 0, playTime = 0, bonusT = 0;
const effects = [];
const keys = {};
let action = false, touchDir = 0;

const G = {
  reset() {
    this.cols = 18; this.rows = 32; this.dir = [1, 0]; this.next = [1, 0]; this.acc = 0;
    this.body = [[5, 16], [4, 16], [3, 16]];
    
    this.food = this.place();
  },
  place() { return [Math.floor(rand() * this.cols), Math.floor(rand() * this.rows)]; },
  update(dt, inp) {
    let gain = 0, dead = false;
    const want = inp.left ? [-1, 0] : inp.right ? [1, 0] : inp.up ? [0, -1] : inp.down ? [0, 1] : null;
    if (want && !(want[0] === -this.dir[0] && want[1] === -this.dir[1])) this.next = want;
    this.acc += dt;
    while (this.acc >= 0.103) {
      this.acc -= 0.103; this.dir = this.next;
      let h = [this.body[0][0] + this.dir[0], this.body[0][1] + this.dir[1]];
      if (h[0] < 0 || h[1] < 0 || h[0] >= this.cols || h[1] >= this.rows || this.body.some(s => s[0] === h[0] && s[1] === h[1])) { dead = true; break; }
      
      this.body.unshift(h);
      if (h[0] === this.food[0] && h[1] === this.food[1]) { gain++; this.food = this.place(); } else this.body.pop();
    }
    return { gain, dead };
  },
  draw(c) {
    c.fillStyle = '#e5e5e5'; c.fillRect(this.food[0] * 20 + 2, this.food[1] * 20 + 2, 16, 16);
    c.fillStyle = '#fca311'; for (const s of this.body) c.fillRect(s[0] * 20 + 1, s[1] * 20 + 1, 18, 18);
  }
};


function reset() { score = 0; bonusT = 0; G.reset(); }
function startOrRestart() {
  if (state === 'start') { reset(); state = 'play'; }
  else if (state === 'over') { reset(); state = 'play'; }
  
}
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    if (state === 'play') action = true; else startOrRestart();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (state !== 'play') { startOrRestart(); return; }
  if (x < 1 / 3) touchDir = -1; else if (x > 2 / 3) touchDir = 1; else action = true;
});
window.addEventListener('pointerup', () => { touchDir = 0; });

function input() {
  return { left: !!(keys.ArrowLeft || keys.a || touchDir < 0), right: !!(keys.ArrowRight || keys.d || touchDir > 0),
           up: !!(keys.ArrowUp || keys.w), down: !!(keys.ArrowDown || keys.s), action };
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#14213d'; ctx.fillRect(0, 0, W, H);
  if (state !== 'start') G.draw(ctx);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  if (state === 'start') { ctx.fillText('SNAKE', W / 2, H / 2 - 20); ctx.font = '16px sans-serif'; ctx.fillText('Tap or press Space', W / 2, H / 2 + 14); }
  else ctx.fillText(String(score), W / 2, 40);
  if (state === 'over') { ctx.fillText('Game over', W / 2, H / 2); ctx.font = '16px sans-serif'; ctx.fillText('Tap or Space to restart', W / 2, H / 2 + 30); }
}
let last = null;
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (state === 'play') {
    playTime += dt;
    
    const r = G.update(dt, input());
    
    action = false;
    score += r.gain;
    bonusT += dt; if (bonusT >= 1) { bonusT -= 1; score += 1; }
    if (r.dead) {
      
      state = 'over'; best = Math.max(best, score);
    }
  }
  
  draw();
  requestAnimationFrame(frame);
}
window.__game = { score: () => score, over: () => state === 'over' };
requestAnimationFrame(frame);
</script></body></html>
