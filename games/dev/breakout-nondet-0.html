<!doctype html><html><head><meta charset="utf-8"><title>BREAKOUT</title>
<style>html,body{margin:0;background:#111;height:100%;display:flex;align-items:center;justify-content:center}canvas{background:#10002b;touch-action:none}</style></head>
<body><canvas id="game" width="360" height="640"></canvas>
<script>
const canvas = document.getElementById('game');

const ctx = canvas.getContext('2d');
const W = 360, H = 640;

const rand = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
let state = 'start', score = 0, best = 0, playTime = 0, bonusT = 0;
const effects = [];
const keys = {};
let action = false, touchDir = 0;

const G = {
  reset() {
    this.px = W / 2; this.bx = W / 2; this.by = 520;
    this.vx = (rand() < 0.5 ? -1 : 1) * 307 * (0.4 + rand() * 0.4); this.vy = -307;
    
    this.bricks = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) this.bricks.push({ x: 12 + c * 56, y: 80 + r * 24, alive: true });
  },
  update(dt, inp) {
    let gain = 0, dead = false;
    this.px += ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * 349 * dt;
    this.px = Math.max(40, Math.min(W - 40, this.px));
    this.bx += this.vx * dt; this.by += this.vy * dt;
    if (this.bx < 6 || this.bx > W - 6) { this.vx = -this.vx; this.bx = Math.max(6, Math.min(W - 6, this.bx)); }
    if (this.by < 6) this.vy = Math.abs(this.vy);
    if (this.vy > 0 && this.by > 590 && this.by < 604 && Math.abs(this.bx - this.px) < 44) { this.vy = -Math.abs(this.vy); this.vx += (this.bx - this.px) * 4; }
    for (const b of this.bricks) if (b.alive && this.bx > b.x && this.bx < b.x + 52 && this.by > b.y && this.by < b.y + 20) { b.alive = false; this.vy = -this.vy; gain++; break; }
    if (this.bricks.every(b => !b.alive)) this.bricks.forEach(b => { b.alive = true; });
    if (this.by > H) {
      dead = true;
      
    }
    return { gain, dead };
  },
  draw(c) {
    c.fillStyle = '#ff006e'; for (const b of this.bricks) if (b.alive) c.fillRect(b.x, b.y, 52, 20);
    c.fillStyle = '#c77dff'; c.fillRect(this.px - 40, 596, 80, 10);
    c.beginPath(); c.arc(this.bx, this.by, 6, 0, Math.PI * 2); c.fill();
  }
};


function reset() { score = 0; bonusT = 0; G.reset(); }
function startOrRestart() {
  if (state === 'start') { reset(); state = 'play'; }
  else if (state === 'over') { reset(); state = 'play'; }
  
}
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    if (state === 'play') action = true; else startOrRestart();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (state !== 'play') { startOrRestart(); return; }
  if (x < 1 / 3) touchDir = -1; else if (x > 2 / 3) touchDir = 1; else action = true;
});
window.addEventListener('pointerup', () => { touchDir = 0; });

function input() {
  return { left: !!(keys.ArrowLeft || keys.a || touchDir < 0), right: !!(keys.ArrowRight || keys.d || touchDir > 0),
           up: !!(keys.ArrowUp || keys.w), down: !!(keys.ArrowDown || keys.s), action };
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#10002b'; ctx.fillRect(0, 0, W, H);
  if (state !== 'start') G.draw(ctx);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  if (state === 'start') { ctx.fillText('BREAKOUT', W / 2, H / 2 - 20); ctx.font = '16px sans-serif'; ctx.fillText('Tap or press Space', W / 2, H / 2 + 14); }
  else ctx.fillText(String(score), W / 2, 40);
  if (state === 'over') { ctx.fillText('Game over', W / 2, H / 2); ctx.font = '16px sans-serif'; ctx.fillText('Tap or Space to restart', W / 2, H / 2 + 30); }
}
let last = null;
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (state === 'play') {
    playTime += dt;
    
    const r = G.update(dt, input());
    
    action = false;
    score += r.gain;
    bonusT += dt; if (bonusT >= 1) { bonusT -= 1; score += 1; }
    if (r.dead) {
      
      state = 'over'; best = Math.max(best, score);
    }
  }
  
  draw();
  requestAnimationFrame(frame);
}
window.__game = { score: () => score, over: () => state === 'over' };
requestAnimationFrame(frame);
</script></body></html>
